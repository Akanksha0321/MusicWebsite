
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Music Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }

        h1 {
            font-size: 36px;
            color: #ffeb3b;
        }

        .music-container {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 15px;
            max-width: 700px;
            margin: 25px auto;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            background-color: #ffeb3b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        #animationArea {
            position: relative;
            max-width: 500px;
            height: 100px;
            margin: 25px auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        #musicNote {
            position: absolute;
            top: 25px;
            left: 0;
            font-size: 40px;
        }
    </style>
</head>

<body>
    <h1>Welcome to My Music Website!</h1>

    <p>Music makes every moment special!</p>

    <div class="music-container">
        <h2>My Favorite Song</h2>
        <p>Enjoy this music video from YouTube.</p>

        
<iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/XO1h5G6xytU"
    title="My Favorite Song"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
</iframe>


        </iframe>

        <h2>JavaScript Music Animation</h2>
        <p>Click the button to animate the music note!</p>

        <div id="animationArea">
            <div id="musicNote">🎵</div>
        </div>

        <button onclick="startAnimation()">
            Start Animation
        </button>
    </div>

    <script>
        function startAnimation() {
            const note = document.getElementById("musicNote");
            const area = document.getElementById("animationArea");

            let position = 0;
            const maxPosition = area.clientWidth - note.offsetWidth;

            clearInterval(window.musicAnimation);

            window.musicAnimation = setInterval(function () {
                if (position >= maxPosition) {
                    clearInterval(window.musicAnimation);
                } else {
                    position += 2;
                    note.style.left = Math.min(position, maxPosition) + "px";
                }
            }, 10);
        }
    </script>
</body>
</html>
